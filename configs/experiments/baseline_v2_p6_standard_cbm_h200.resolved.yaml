common_execution_profile:
  formal_gpu_model: H200
  path: configs/experiments/baseline_v2_reference_training_h200_warn_only.yaml
  resolved_sha256: 66c925a7b43bf9fa312ceb850b43746a34d1808888667c39392eaef9e47495bb
model: standard_cbm
phase: P6
project_preregistered:
  concept_loss:
    categorical: sample_mean_soft_target_cross_entropy_from_logits
    categorical_hard_modal_labels: false
    class_weights: false
    continuous: sample_mean_mse_on_sigmoid_prediction
    epoch_reduction: sum_then_divide_by_partition_sample_count
    group_reduction: arithmetic_mean_of_8_group_losses
  concept_predictor:
    canonical_task_vector:
      dimension: 16
      layout:
      - subtlety_sigmoid_scalar
      - internalStructure_softmax_classes_1_to_4
      - calcification_softmax_classes_1_to_6
      - sphericity_sigmoid_scalar
      - margin_sigmoid_scalar
      - lobulation_sigmoid_scalar
      - spiculation_sigmoid_scalar
      - texture_sigmoid_scalar
      malignancy_as_input_concept: false
      preactivation_logits_as_task_input: false
      source: activated_predictions
    encoder_feature_size: 1024
    feature_transform:
    - relu
    - global_average_pooling
    group_order:
    - subtlety
    - internalStructure
    - calcification
    - sphericity
    - margin
    - lobulation
    - spiculation
    - texture
    head_type: independent_linear_no_hidden_layer
    heads:
      calcification:
        activation: softmax
        output_size: 6
      internalStructure:
        activation: softmax
        output_size: 4
      lobulation:
        activation: sigmoid
        output_size: 1
      margin:
        activation: sigmoid
        output_size: 1
      sphericity:
        activation: sigmoid
        output_size: 1
      spiculation:
        activation: sigmoid
        output_size: 1
      subtlety:
        activation: sigmoid
        output_size: 1
      texture:
        activation: sigmoid
        output_size: 1
    logits:
      retain_for_audit_and_future_gradcam: true
      task_head_input: false
  contributions:
    categorical: activated_probability_vector_dot_linear_weight_block
    continuous: activated_scalar_times_linear_weight
    normalized_reconstruction_tolerance: 1.0e-06
    rating_point_multiplier: 4.0
    rating_reconstruction_tolerance: 1.0e-06
    rating_scale_bias: 1_plus_4_times_raw_bias
  deterministic_initialization:
    concept_head_seed_material: Baseline-v2/P6/standard-cbm-concept-head/<group> || fold_seed
    derivation: sha256_material_first_8_bytes_unsigned_big_endian_mask_63_bits
    isolated_cpu_rng: true
    order_independent_concept_heads: true
    task_head_seed_material: Baseline-v2/P6/standard-cbm-task-head || fold_seed
  execution_gate:
    formal_folds:
    - 0
    - 1
    - 2
    - 3
    - 4
    formal_gpu_model: H200
    intermediate_fold_0_approval_required: false
    stage_a_fold: 0
    stage_a_formal_training: false
    submit_all_five_formal_folds_after_stage_a_pass: true
  sequential_training:
    cache_gate:
      batchnorm_state: frozen
      forbidden_before_task_best:
      - test
      generated_before_task_training:
      - train
      - validation
      ground_truth_concepts_as_task_features: forbidden
      input_augmentation: false
      predictor_mode: eval
      predictor_requires_grad: false
      retain_preactivation_logits_for_audit: true
      source_checkpoint: frozen_concept_best
      values: activated_predicted_concepts_float32
    concept_stage:
      checkpoint_objective: minimum_validation_concept_loss
      checkpoint_tie_break: earlier_epoch
      epochs: 80
      optimizer_and_batching: inherit_common_execution_profile
      scheduler_monitor: validation_concept_loss
      train_augmentation: true
      validation_augmentation: false
    task_stage:
      checkpoint_objective: minimum_validation_task_mse
      checkpoint_tie_break: earlier_epoch
      epochs: 80
      ground_truth_concepts: forbidden
      head: unconstrained_linear_16_to_1
      input: frozen_activated_predicted_concepts
      input_dimension: 16
      optimizer_and_batching: inherit_common_execution_profile
      output_activation: none
      reads_encoder_features: false
      reads_images: false
      scheduler_monitor: validation_task_mse
    test_transaction:
      generate_test_concepts_after_task_best_only: true
      require_concept_best: true
      require_task_best: true
      require_verified_train_validation_cache: true
      test_inference_exactly_once: true
  statement: Baseline-v2 P6 project pre-registered implementation choices, not exact hyperparameters reported by the reference paper.
protocol_version: Baseline-v2
schema_version: 1
scientific_config:
  path: configs/baseline_v2.yaml
  sha256: 07ad34dc3449383bb195d126d6fedc1db3428198b2144fa75dc38fad939c33ce
